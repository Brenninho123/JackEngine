name: Build Android

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Accept Licenses and Install Packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Prepare Directories
        run: |
          mkdir -p android/app/src/main/java
          mkdir -p android/app/src/main/res
          mkdir -p android/app/libs
          mkdir -p build

      - name: Compile Engine Sources
        run: |
          find . -name "*.java" -not -path "./android/*" > sources.txt
          javac -d build @sources.txt

      - name: Package Engine Jar
        run: |
          printf "Main-Class: Main\n\n" > manifest.txt
          jar cfm JackEngine.jar manifest.txt -C build .
          cp JackEngine.jar android/app/libs/

      - name: Copy Assets
        run: |
          cp -r assets build/assets 2>/dev/null || true
          cp -r arts build/arts 2>/dev/null || true

      - name: Generate AndroidManifest.xml
        run: |
          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.jackengine.game">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>

              <application
                  android:label="Jack Engine"
                  android:hardwareAccelerated="true"
                  android:resizeableActivity="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="landscape">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

      - name: Generate MainActivity
        run: |
          cat > android/app/src/main/java/MainActivity.java <<'EOF'
          import android.app.Activity;
          import android.os.Bundle;

          public class MainActivity extends Activity
          {
              @Override
              protected void onCreate(Bundle savedInstanceState)
              {
                  super.onCreate(savedInstanceState);
              }
          }
          EOF

      - name: Generate Root Build Gradle
        run: |
          cat > android/build.gradle <<'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.4.0'
              }
          }

          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

      - name: Generate App Build Gradle
        run: |
          cat > android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.jackengine.game'
              compileSdk 34

              defaultConfig {
                  applicationId "com.jackengine.game"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "0.1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }

          dependencies {
              implementation fileTree(dir: 'libs', include: ['*.jar'])
          }
          EOF

      - name: Generate Settings Gradle
        run: |
          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          rootProject.name = 'JackEngine'
          include ':app'
          EOF

      - name: Generate Gradle Wrapper
        run: |
          cd android
          gradle wrapper --gradle-version 8.6
          chmod +x gradlew

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JackEngine-APK
          path: android/app/build/outputs/apk/release/*.apk