name: Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare Directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build
          New-Item -ItemType Directory -Force dist

      - name: Compile Engine
        shell: pwsh
        run: |
          $sources = Get-ChildItem -Recurse -Filter "*.java" | Where-Object {
            $_.FullName -notlike "*\android\*" -and $_.Name -ne "Main.java"
          } | Select-Object -ExpandProperty FullName

          $sources += (Get-Item "Main.java").FullName

          $sources | Out-File -Encoding UTF8 sources.txt

          javac -d build "@sources.txt"

      - name: Copy Assets
        shell: pwsh
        run: |
          if (Test-Path assets) { Copy-Item assets build/assets -Recurse -Force }
          if (Test-Path arts)   { Copy-Item arts build/arts -Recurse -Force }
          if (Test-Path config.json) { Copy-Item config.json build/config.json -Force }

      - name: Package Jar
        shell: pwsh
        run: |
          "Main-Class: Main`n" | Out-File -Encoding ASCII manifest.txt
          jar cfm JackEngine.jar manifest.txt -C build .

      - name: Build EXE
        shell: pwsh
        run: |
          jpackage `
            --type exe `
            --name "JackEngine" `
            --input . `
            --main-jar JackEngine.jar `
            --main-class Main `
            --dest dist

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: JackEngine-Windows
          path: dist/

  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Accept Licenses and Install Packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Prepare Directories
        run: |
          mkdir -p android/app/src/main/java/source/mobile
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/assets

      - name: Copy Shared Sources
        run: |
          cp Project.java android/app/src/main/java/Project.java
          find source -name "*.java" -not -name "Main.java" | while read f; do
            rel="${f#source/}"
            dest="android/app/src/main/java/source/${rel}"
            mkdir -p "$(dirname "$dest")"
            cp "$f" "$dest"
          done

      - name: Copy Assets
        run: |
          cp -r assets/. android/app/src/main/assets/ 2>/dev/null || true
          cp -r arts/.   android/app/src/main/res/drawable/ 2>/dev/null || true
          cp config.json android/app/src/main/assets/config.json 2>/dev/null || true

      - name: Generate Scene
        run: |
          cat > android/app/src/main/java/Scene.java <<'EOF'
          import android.graphics.Canvas;
          import android.view.KeyEvent;

          public class Scene
          {
              public void update() {}

              public void render(Canvas canvas) {}

              public void keyPressed(int keyCode, KeyEvent event) {}

              public void keyReleased(int keyCode, KeyEvent event) {}

              public void touchDown(float x, float y, int pointer) {}

              public void touchUp(float x, float y, int pointer) {}

              public void touchDragged(float x, float y, int pointer) {}

              public void onWindowClose() {}

              public void destroy() {}
          }
          EOF

      - name: Generate Input
        run: |
          cat > android/app/src/main/java/Input.java <<'EOF'
          import java.util.HashSet;
          import java.util.Set;

          public class Input
          {
              public float touchX;
              public float touchY;

              private final Set<Integer> keysDown         = new HashSet<>();
              private final Set<Integer> keysJustPressed  = new HashSet<>();
              private final Set<Integer> keysJustReleased = new HashSet<>();
              private final Set<Integer> pointersDown     = new HashSet<>();

              public void update()
              {
                  keysJustPressed.clear();
                  keysJustReleased.clear();
              }

              public void onKeyPressed(int keyCode)
              {
                  if (!keysDown.contains(keyCode))
                      keysJustPressed.add(keyCode);

                  keysDown.add(keyCode);
              }

              public void onKeyReleased(int keyCode)
              {
                  keysDown.remove(keyCode);
                  keysJustReleased.add(keyCode);
              }

              public void onTouchDown(float x, float y, int pointer)
              {
                  touchX = x;
                  touchY = y;
                  pointersDown.add(pointer);
              }

              public void onTouchUp(float x, float y, int pointer)
              {
                  touchX = x;
                  touchY = y;
                  pointersDown.remove(pointer);
              }

              public void onTouchDragged(float x, float y, int pointer)
              {
                  touchX = x;
                  touchY = y;
              }

              public boolean isKeyDown(int keyCode)        { return keysDown.contains(keyCode); }
              public boolean isKeyJustPressed(int keyCode) { return keysJustPressed.contains(keyCode); }
              public boolean isKeyJustReleased(int keyCode){ return keysJustReleased.contains(keyCode); }
              public boolean isTouching()                  { return !pointersDown.isEmpty(); }
              public boolean isTouching(int pointer)       { return pointersDown.contains(pointer); }

              public void clear()
              {
                  keysDown.clear();
                  keysJustPressed.clear();
                  keysJustReleased.clear();
                  pointersDown.clear();
              }
          }
          EOF

      - name: Generate Main
        run: |
          cat > android/app/src/main/java/Main.java <<'EOF'
          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.view.KeyEvent;
          import android.view.MotionEvent;
          import android.view.SurfaceHolder;
          import android.view.SurfaceView;

          import source.mobile.MobileSystem;

          public class Main extends SurfaceView implements SurfaceHolder.Callback, Runnable
          {
              public static Main instance;
              public static Project project;

              public static int width;
              public static int height;
              public static int framerate;

              public static boolean running;
              public static boolean mobile  = true;
              public static boolean focused = true;
              public static boolean paused  = false;

              public static long currentFrame;
              public static long engineStartTime;
              public static double deltaTime;

              public static Scene currentScene;
              public static Scene pendingScene;

              public static final Input input = new Input();

              private Thread gameThread;
              private SurfaceHolder surfaceHolder;

              static
              {
                  project = new Project();
              }

              public Main(Context context)
              {
                  super(context);

                  instance = this;

                  width     = project.width;
                  height    = project.height;
                  framerate = project.framerate;
                  running   = true;

                  engineStartTime = System.currentTimeMillis();

                  surfaceHolder = getHolder();
                  surfaceHolder.addCallback(this);

                  setFocusable(true);
                  setFocusableInTouchMode(true);

                  MobileSystem.initialize(
                      width,
                      height,
                      project.landscapeMode,
                      project.autoMobileScaling,
                      project.touchControls,
                      project.mobileShaders
                  );

                  initialize();
              }

              private void initialize()
              {
                  currentScene = new Scene();
              }

              @Override
              public void surfaceCreated(SurfaceHolder holder)
              {
                  running    = true;
                  gameThread = new Thread(this);
                  gameThread.setDaemon(true);
                  gameThread.setName("JackEngine-Loop");
                  gameThread.start();
              }

              @Override
              public void surfaceChanged(SurfaceHolder holder, int format, int w, int h)
              {
                  width  = w;
                  height = h;

                  MobileSystem.resize(w, h);
              }

              @Override
              public void surfaceDestroyed(SurfaceHolder holder)
              {
                  running = false;

                  try
                  {
                      gameThread.join();
                  }
                  catch (InterruptedException e)
                  {
                      Thread.currentThread().interrupt();
                  }
              }

              @Override
              public void run()
              {
                  long targetNanos = 1_000_000_000L / framerate;
                  long lastTime    = System.nanoTime();
                  double delta     = 0;

                  while (running)
                  {
                      long now     = System.nanoTime();
                      long elapsed = now - lastTime;
                      lastTime     = now;

                      delta    += elapsed / (double) targetNanos;
                      deltaTime = elapsed / 1_000_000_000.0;

                      if (delta >= 1)
                      {
                          delta = Math.min(delta - 1, 1);

                          if (!paused)
                          {
                              flushPendingScene();
                              input.update();
                              update();
                          }

                          render();

                          currentFrame++;
                      }

                      try
                      {
                          Thread.sleep(1);
                      }
                      catch (InterruptedException e)
                      {
                          Thread.currentThread().interrupt();
                      }
                  }
              }

              private void flushPendingScene()
              {
                  if (pendingScene == null)
                      return;

                  if (currentScene != null)
                      currentScene.destroy();

                  currentScene = pendingScene;
                  pendingScene = null;
              }

              private void update()
              {
                  if (currentScene != null)
                      currentScene.update();
              }

              private void render()
              {
                  Canvas canvas = surfaceHolder.lockCanvas();

                  if (canvas == null)
                      return;

                  try
                  {
                      canvas.drawColor(Color.BLACK);

                      if (MobileSystem.autoScaling)
                      {
                          canvas.save();
                          canvas.translate(MobileSystem.offsetX, MobileSystem.offsetY);
                          canvas.scale(MobileSystem.scale, MobileSystem.scale);
                      }

                      if (currentScene != null)
                          currentScene.render(canvas);

                      if (MobileSystem.autoScaling)
                          canvas.restore();
                  }
                  finally
                  {
                      surfaceHolder.unlockCanvasAndPost(canvas);
                  }
              }

              @Override
              public boolean onKeyDown(int keyCode, KeyEvent event)
              {
                  if (!paused)
                  {
                      input.onKeyPressed(keyCode);

                      if (currentScene != null)
                          currentScene.keyPressed(keyCode, event);
                  }

                  return true;
              }

              @Override
              public boolean onKeyUp(int keyCode, KeyEvent event)
              {
                  input.onKeyReleased(keyCode);

                  if (currentScene != null)
                      currentScene.keyReleased(keyCode, event);

                  return true;
              }

              @Override
              public boolean onTouchEvent(MotionEvent event)
              {
                  if (paused)
                      return true;

                  int action  = event.getActionMasked();
                  int index   = event.getActionIndex();
                  int pointer = event.getPointerId(index);
                  float x     = event.getX(index);
                  float y     = event.getY(index);

                  if (action == MotionEvent.ACTION_DOWN || action == MotionEvent.ACTION_POINTER_DOWN)
                  {
                      MobileSystem.onTouchDown(pointer, x, y);
                      input.onTouchDown(x, y, pointer);

                      if (currentScene != null)
                          currentScene.touchDown(MobileSystem.toScreenX(x), MobileSystem.toScreenY(y), pointer);
                  }
                  else if (action == MotionEvent.ACTION_UP || action == MotionEvent.ACTION_POINTER_UP)
                  {
                      MobileSystem.onTouchUp(pointer, x, y);
                      input.onTouchUp(x, y, pointer);

                      if (currentScene != null)
                          currentScene.touchUp(MobileSystem.toScreenX(x), MobileSystem.toScreenY(y), pointer);
                  }
                  else if (action == MotionEvent.ACTION_MOVE)
                  {
                      for (int i = 0; i < event.getPointerCount(); i++)
                      {
                          int pid  = event.getPointerId(i);
                          float px = event.getX(i);
                          float py = event.getY(i);

                          MobileSystem.onTouchDragged(pid, px, py);
                          input.onTouchDragged(px, py, pid);

                          if (currentScene != null)
                              currentScene.touchDragged(MobileSystem.toScreenX(px), MobileSystem.toScreenY(py), pid);
                      }
                  }
                  else if (action == MotionEvent.ACTION_CANCEL)
                  {
                      MobileSystem.clearPointers();
                      input.clear();
                  }

                  return true;
              }

              public static void switchScene(Scene scene)  { pendingScene = scene; }
              public static void pause()                   { paused = true; }
              public static void resume()                  { paused = false; }
              public static long getEngineUptime()         { return System.currentTimeMillis() - engineStartTime; }
              public static double getDeltaTime()          { return deltaTime; }
              public static void shutdown()                { running = false; }
          }
          EOF

      - name: Generate MainActivity
        run: |
          cat > android/app/src/main/java/MainActivity.java <<'EOF'
          import android.app.Activity;
          import android.os.Bundle;
          import android.view.Window;
          import android.view.WindowManager;

          public class MainActivity extends Activity
          {
              @Override
              protected void onCreate(Bundle savedInstanceState)
              {
                  super.onCreate(savedInstanceState);

                  requestWindowFeature(Window.FEATURE_NO_TITLE);

                  getWindow().setFlags(
                      WindowManager.LayoutParams.FLAG_FULLSCREEN,
                      WindowManager.LayoutParams.FLAG_FULLSCREEN
                  );

                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                  setContentView(new Main(this));
              }

              @Override
              protected void onPause()
              {
                  super.onPause();
                  Main.running = false;
                  Main.focused = false;
                  Main.paused  = true;
                  Main.input.clear();
              }

              @Override
              protected void onResume()
              {
                  super.onResume();
                  Main.running = true;
                  Main.focused = true;
                  Main.paused  = false;

                  if (Main.instance != null)
                      Main.instance.getHolder().addCallback(Main.instance);
              }

              @Override
              protected void onDestroy()
              {
                  super.onDestroy();

                  if (Main.currentScene != null)
                      Main.currentScene.onWindowClose();

                  Main.shutdown();
              }
          }
          EOF

      - name: Generate AndroidManifest.xml
        run: |
          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.jackengine.game">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>

              <application
                  android:label="Jack Engine"
                  android:hardwareAccelerated="true"
                  android:resizeableActivity="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:screenOrientation="landscape">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

      - name: Generate Root Build Gradle
        run: |
          cat > android/build.gradle <<'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.4.0'
              }
          }

          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

      - name: Generate App Build Gradle
        run: |
          cat > android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.jackengine.game'
              compileSdk 34

              defaultConfig {
                  applicationId "com.jackengine.game"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "0.1.0"
              }

              buildTypes {
                  debug {
                      debuggable true
                  }
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_11
                  targetCompatibility JavaVersion.VERSION_11
              }

              sourceSets {
                  main {
                      java.srcDirs = ['src/main/java']
                  }
              }
          }
          EOF

      - name: Generate Settings Gradle
        run: |
          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          rootProject.name = 'JackEngine'
          include ':app'
          EOF

      - name: Generate Gradle Wrapper
        run: |
          cd android
          gradle wrapper --gradle-version 8.6
          chmod +x gradlew

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JackEngine-Android
          path: android/app/build/outputs/apk/debug/*.apk
